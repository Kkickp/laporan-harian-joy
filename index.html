<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Harian Joy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-1.5 sm:p-4 min-h-screen">

  <div class="max-w-3xl mx-auto bg-white p-2.5 sm:p-5 rounded-xl shadow-md container-card" id="laporan-content">
    
    <!-- HEADER -->
    <div class="border-b-2 border-slate-800 pb-1.5 mb-2.5 text-center">
      <h1 class="text-base sm:text-xl font-bold tracking-wide uppercase text-slate-900">LAPORAN HARIAN PENJUALAN</h1>
      <p class="text-[9px] sm:text-xs text-slate-500 font-medium">Sistem Catatan Kasir & Stok Digital</p>
    </div>

    <!-- BOX NOTIFIKASI WARNING -->
    <div id="warning-alert" class="hidden no-print mb-2.5 p-2 bg-red-50 border-l-4 border-red-500 text-red-700 text-xs rounded"></div>

    <!-- INFO FORM HEADER -->
    <div class="grid grid-cols-3 gap-2 mb-2.5 bg-slate-50 p-2 rounded-lg border border-slate-200">
      <div>
        <label class="block text-[9px] sm:text-xs font-bold text-slate-600 mb-0.5">TEMPAT:</label>
        <input type="text" id="input-tempat" oninput="saveData()" placeholder="Cabang"
          class="w-full text-xs font-semibold p-1 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-[9px] sm:text-xs font-bold text-slate-600 mb-0.5">TANGGAL:</label>
        <input type="date" id="input-tanggal" onchange="saveData()"
          class="w-full text-xs font-semibold p-1 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-[9px] sm:text-xs font-bold text-slate-600 mb-0.5">KASIR:</label>
        <input type="text" id="input-kasir" oninput="saveData()" placeholder="Kasir"
          class="w-full text-xs font-semibold p-1 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <!-- TABEL STOK -->
    <div class="mb-2.5">
      <h2 class="text-xs font-bold bg-slate-800 text-white px-2 py-0.5 rounded-t">LAPORAN STOK</h2>
      <div class="overflow-x-auto border border-t-0 border-slate-300 rounded-b">
        <table class="w-full text-xs text-left min-w-[300px]">
          <thead class="bg-slate-100 text-[10px] text-slate-700 uppercase border-b border-slate-300">
            <tr>
              <th class="p-1 border-r">NAMA BARANG</th>
              <th class="p-1 border-r w-14 text-center">AWAL</th>
              <th class="p-1 border-r w-14 text-center">SISA</th>
              <th class="p-1 w-14 text-center bg-slate-200">TERJUAL</th>
            </tr>
          </thead>
          <tbody id="stok-table-body">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- TABEL PENJUALAN -->
    <div class="mb-2.5">
      <h2 class="text-xs font-bold bg-slate-800 text-white px-2 py-0.5 rounded-t">LAPORAN PENJUALAN</h2>
      <div class="overflow-x-auto border border-t-0 border-slate-300 rounded-b">
        <table class="w-full text-xs text-left min-w-[320px]">
          <thead class="bg-slate-100 text-[10px] text-slate-700 uppercase border-b border-slate-300">
            <tr>
              <th class="p-1 border-r">NAMA BARANG</th>
              <th class="p-1 border-r w-20 text-right">HARGA JUAL</th>
              <th class="p-1 border-r w-14 text-center">LAKU (QTY)</th>
              <th class="p-1 w-24 text-right bg-slate-200">JUMLAH (RP)</th>
            </tr>
          </thead>
          <tbody id="penjualan-table-body">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- METODE PEMBAYARAN & TOTAL -->
    <div class="bg-slate-50 p-2 rounded-lg border border-slate-200 space-y-1.5 mb-2.5 pdf-keep-together">
      <div class="flex items-center justify-between text-xs font-semibold">
        <label for="input-qr" class="text-slate-700">PEMBAYARAN QR (Rp):</label>
        <input type="number" id="input-qr" oninput="calculateTotal(); saveData();" placeholder="0"
          class="w-28 sm:w-36 text-right p-1 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="flex items-center justify-between text-xs font-semibold">
        <label for="input-cash" class="text-slate-700">PEMBAYARAN CASH (Rp):</label>
        <input type="number" id="input-cash" oninput="calculateTotal(); saveData();" placeholder="0"
          class="w-28 sm:w-36 text-right p-1 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-900 border-t border-slate-300 pt-1.5">
        <span>TOTAL PENJUALAN:</span>
        <span id="grand-total" class="text-blue-700 text-sm sm:text-base">Rp 0</span>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="no-print flex justify-between items-center pt-1 gap-2">
      <button onclick="clearForm()" class="px-3 py-1.5 bg-rose-100 text-rose-700 font-semibold rounded hover:bg-rose-200 transition text-xs">
        Reset Form
      </button>
      <button onclick="downloadPDF()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded shadow hover:bg-blue-700 transition flex items-center gap-1.5 text-xs">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Download PDF
      </button>
    </div>

  </div>

  <script src="Script.js"></script>
</body>
</html>
