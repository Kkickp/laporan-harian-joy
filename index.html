<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Penjualan Harian</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-border-none {
                border: none !important;
            }
            body {
                background-color: #fff !important;
                padding: 0 !important;
            }
            .shadow-card {
                box-shadow: none !important;
                border: 1px solid #e5e7eb !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 md:p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header Controls (No Print) -->
        <div class="no-print bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="file-spreadsheet" class="w-6 h-6 text-indigo-600"></i>
                    Sistem Laporan Penjualan Harian
                </h1>
                <p class="text-sm text-slate-500">Konversi laporan manual dari kertas ke digital</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="fillSampleData()" class="px-3 py-2 text-sm font-medium bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200 rounded-lg transition-colors flex items-center gap-1.5">
                    <i data-lucide="file-text" class="w-4 h-4"></i> Isi Data dari Foto
                </button>
                <button onclick="resetForm()" class="px-3 py-2 text-sm font-medium bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 rounded-lg transition-colors flex items-center gap-1.5">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset Form
                </button>
                <button onclick="window.print()" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm transition-colors flex items-center gap-1.5">
                    <i data-lucide="printer" class="w-4 h-4"></i> Cetak / Simpan PDF
                </button>
            </div>
        </div>

        <!-- Printable Report Sheet -->
        <div class="bg-white rounded-2xl shadow-card border border-slate-200 p-6 md:p-8 space-y-6">
            
            <div class="border-b border-slate-200 pb-5">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">TEMPAT:</label>
                        <input type="text" id="info-tempat" placeholder="Contoh: Outlet Utama" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">TGL:</label>
                        <input type="date" id="info-tgl" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">KASIR:</label>
                        <input type="text" id="info-kasir" placeholder="Nama Kasir" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-base font-bold text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg border-l-4 border-indigo-600 mb-3 flex justify-between items-center">
                    <span>STOK</span>
                    <span class="text-xs font-normal text-slate-500">Perhitungan Stok Awal & Sisa</span>
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 border-b border-slate-200">
                                <th class="py-2.5 px-3 font-semibold w-1/2">NAMA ITEM</th>
                                <th class="py-2.5 px-3 font-semibold text-center w-1/4">AWAL</th>
                                <th class="py-2.5 px-3 font-semibold text-center w-1/4">SISA</th>
                            </tr>
                        </thead>
                        <tbody id="stok-tbody" class="divide-y divide-slate-100">
                            <!-- Rows generated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div>
                <h2 class="text-base font-bold text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg border-l-4 border-indigo-600 mb-3 flex justify-between items-center">
                    <span>PENJUALAN</span>
                    <span class="text-xs font-normal text-slate-500">Rincian Barang Terjual</span>
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 border-b border-slate-200">
                                <th class="py-2.5 px-3 font-semibold">NAMA BARANG / ITEM</th>
                                <th class="py-2.5 px-3 font-semibold text-center w-28">LAKU (QTY)</th>
                                <th class="py-2.5 px-3 font-semibold text-right w-44">JUMLAH (RP)</th>
                            </tr>
                        </thead>
                        <tbody id="penjualan-tbody" class="divide-y divide-slate-100">
                            <!-- Rows generated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-200">
                <div class="max-w-md ml-auto space-y-2 text-sm">
                    <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50">
                        <span class="font-bold text-slate-700">QR / TRANSFER:</span>
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500 text-xs font-semibold">Rp</span>
                            <input type="text" id="pay-qr" oninput="formatCurrencyInput(this); calculateTotal();" placeholder="0" class="text-right font-bold w-36 bg-white border border-slate-300 rounded px-2 py-1 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50">
                        <span class="font-bold text-slate-700">CASH (TUNAI):</span>
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500 text-xs font-semibold">Rp</span>
                            <input type="text" id="pay-cash" oninput="formatCurrencyInput(this); calculateTotal();" placeholder="0" class="text-right font-bold w-36 bg-white border border-slate-300 rounded px-2 py-1 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-3 rounded-lg bg-indigo-50 border border-indigo-200 text-indigo-950 font-bold text-base">
                        <span>TOTAL PENJUALAN:</span>
                        <span id="grand-total" class="text-indigo-700 font-extrabold text-lg">Rp 0</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Item Stok List based on handwritten form
        const stokItems = [
            { name: "Cinnamon", awal: "", sisa: "" },
            { name: "Joy Choux", awal: "", sisa: "" },
            { name: "Mac n cheese", awal: "", sisa: "" },
            { name: "Donang", awal: "", sisa: "" },
            { name: "Joy QQ", awal: "", sisa: "" },
            { name: "Cheesecake", awal: "", sisa: "" },
        ];

        // Item Penjualan List based on handwritten form
        const penjualanItems = [
            { name: "Single Cinn", laku: "", jml: "" },
            { name: "Cinn standar isi 4", laku: "", jml: "" },
            { name: "Joy Choux 6", laku: "", jml: "" },
            { name: "Joy chocuk 7k", laku: "", jml: "" },
            { name: "Joy Choux 15 (isi 3)", laku: "", jml: "" },
            { name: "Joy Choux 25", laku: "", jml: "" },
            { name: "Mac n cheese 15", laku: "", jml: "" },
            { name: "Mac n cheese 18", laku: "", jml: "" },
            { name: "Mac n cheese 20", laku: "", jml: "" },
            { name: "Mac n cheese 25", laku: "", jml: "" },
            { name: "Donang 28", laku: "", jml: "" },
            { name: "Donang 30", laku: "", jml: "" },
            { name: "Donang 32", laku: "", jml: "" },
            { name: "Donang 50", laku: "", jml: "" },
            { name: "Donang 55", laku: "", jml: "" },
            { name: "Donang 140", laku: "", jml: "" },
            { name: "Donang 160", laku: "", jml: "" },
            { name: "Joy QQ", laku: "", jml: "" },
            { name: "Cheesecake", laku: "", jml: "" },
        ];

        function renderStokTable() {
            const tbody = document.getElementById('stok-tbody');
            tbody.innerHTML = '';
            stokItems.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-2 px-3 font-medium text-slate-700">${item.name}</td>
                    <td class="py-2 px-3 text-center">
                        <input type="text" id="stok-awal-${index}" value="${item.awal}" placeholder="-" class="w-full text-center bg-slate-50 border border-slate-200 rounded px-2 py-1 text-sm focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:outline-none">
                    </td>
                    <td class="py-2 px-3 text-center">
                        <input type="text" id="stok-sisa-${index}" value="${item.sisa}" placeholder="-" class="w-full text-center bg-slate-50 border border-slate-200 rounded px-2 py-1 text-sm focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:outline-none">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderPenjualanTable() {
            const tbody = document.getElementById('penjualan-tbody');
            tbody.innerHTML = '';
            penjualanItems.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-2 px-3 font-medium text-slate-700">${item.name}</td>
                    <td class="py-2 px-3 text-center">
                        <input type="text" id="penjualan-laku-${index}" value="${item.laku}" placeholder="-" class="w-full text-center bg-slate-50 border border-slate-200 rounded px-2 py-1 text-sm focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:outline-none">
                    </td>
                    <td class="py-2 px-3 text-right">
                        <div class="flex items-center justify-end gap-1">
                            <span class="text-xs text-slate-400">Rp</span>
                            <input type="text" id="penjualan-jml-${index}" value="${item.jml}" oninput="formatCurrencyInput(this); calculateTotal();" placeholder="0" class="w-32 text-right bg-slate-50 border border-slate-200 rounded px-2 py-1 text-sm font-semibold text-slate-800 focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function parseCurrency(str) {
            if (!str) return 0;
            const cleaned = str.toString().replace(/[^0-9]/g, '');
            return parseInt(cleaned, 10) || 0;
        }

        function formatCurrencyNumber(num) {
            return num.toLocaleString('id-ID');
        }

        function formatCurrencyInput(input) {
            const val = parseCurrency(input.value);
            if (val === 0 && input.value === '') {
                input.value = '';
            } else {
                input.value = formatCurrencyNumber(val);
            }
        }

        function calculateTotal() {
            let total = 0;
            penjualanItems.forEach((_, index) => {
                const inputJml = document.getElementById(`penjualan-jml-${index}`);
                if (inputJml) {
                    total += parseCurrency(inputJml.value);
                }
            });

            document.getElementById('grand-total').innerText = 'Rp ' + formatCurrencyNumber(total);
        }

        function fillSampleData() {
            // Set Info Header
            document.getElementById('info-tempat').value = 'Outlet Utama';
            document.getElementById('info-tgl').value = new Date().toISOString().split('T')[0];
            document.getElementById('info-kasir').value = 'Siti';
            document.getElementById('signature-kasir').innerText = 'Siti';

            // Sample Stok Data from photo
            const stokDataSample = [
                { awal: "69", sisa: "9" },
                { awal: "159 + 39", sisa: "8 + 5" },
                { awal: "27", sisa: "14" },
                { awal: "-", sisa: "-" },
                { awal: "-", sisa: "-" },
                { awal: "32", sisa: "29" }
            ];

            stokDataSample.forEach((data, index) => {
                if (document.getElementById(`stok-awal-${index}`)) {
                    document.getElementById(`stok-awal-${index}`).value = data.awal;
                    document.getElementById(`stok-sisa-${index}`).value = data.sisa;
                }
            });

            // Sample Penjualan Data from photo
            const penjualanSample = [
                { laku: "44", jml: "484.000" },
                { laku: "4", jml: "152.000" },
                { laku: "34", jml: "204.000" },
                { laku: "39 box", jml: "585.000" },
                { laku: "-", jml: "" },
                { laku: "9", jml: "135.000" },
                { laku: "3", jml: "54.000" },
                { laku: "-", jml: "" },
                { laku: "1", jml: "25.000" },
                { laku: "1", jml: "28.000" },
                { laku: "4", jml: "120.000" },
                { laku: "-", jml: "" },
                { laku: "-", jml: "" },
                { laku: "2", jml: "110.000" },
                { laku: "-", jml: "" },
                { laku: "-", jml: "" },
                { laku: "-", jml: "" },
                { laku: "34", jml: "238.000" },
                { laku: "29", jml: "1.015.000" }
            ];

            penjualanSample.forEach((data, index) => {
                if (document.getElementById(`penjualan-laku-${index}`)) {
                    document.getElementById(`penjualan-laku-${index}`).value = data.laku;
                    document.getElementById(`penjualan-jml-${index}`).value = data.jml;
                }
            });

            // Payment method totals from photo
            document.getElementById('pay-qr').value = '2.549.000';
            document.getElementById('pay-cash').value = '828.000';

            calculateTotal();
        }

        function resetForm() {
            document.getElementById('info-tempat').value = '';
            document.getElementById('info-tgl').value = '';
            document.getElementById('info-kasir').value = '';
            document.getElementById('pay-qr').value = '';
            document.getElementById('pay-cash').value = '';

            stokItems.forEach((_, index) => {
                if(document.getElementById(`stok-awal-${index}`)) document.getElementById(`stok-awal-${index}`).value = '';
                if(document.getElementById(`stok-sisa-${index}`)) document.getElementById(`stok-sisa-${index}`).value = '';
            });

            penjualanItems.forEach((_, index) => {
                if(document.getElementById(`penjualan-laku-${index}`)) document.getElementById(`penjualan-laku-${index}`).value = '';
                if(document.getElementById(`penjualan-jml-${index}`)) document.getElementById(`penjualan-jml-${index}`).value = '';
            });

            calculateTotal();
        }

        // Initialize App
        window.onload = function() {
            renderStokTable();
            renderPenjualanTable();
            lucide.createIcons();
        };
    </script>
</body>
</html>
